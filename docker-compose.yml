services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: tru3ty-portfolio
    restart: unless-stopped
    # В Dokploy НЕ публикуем host-порт: его reverse-proxy (Traefik) ходит к
    # контейнеру по внутренней сети на :80. Публикация порта приводит к
    # конфликтам вида "Bind for 0.0.0.0:3000 failed: port is already allocated".
    expose:
      - "80"
    # Для локального запуска без Dokploy раскомментируй маппинг (поменяй
    # левый порт, если 3000 занят):
    # ports:
    #   - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
